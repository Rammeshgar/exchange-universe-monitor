<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exchange Universe Status Monitoring</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
    <link rel="stylesheet" href="dashboard.css">
    <script defer src="assets/echarts.js"></script>
    <script defer src="assets/echarts-gl.js"></script>
    <script defer src="assets/three.js"></script>
    <script defer src="charts.js"></script>
    <script defer src="dashboard.js"></script>
</head>
<body>
    <canvas id="bg-canvas" aria-hidden="true"></canvas>
    <audio id="ambient-music" preload="none" src="assets/ambient.mp3" loop></audio>

    <header class="site-header">
        <div class="header-content">
            <a class="logo-container" href="https://sadeq.shinyapps.io/exchange_universe/" target="_blank" rel="noopener" aria-label="Open the live Exchange Universe app">
                <img src="assets/logo-mark.svg" alt="" width="40" height="40">
                <h1>Exchange Universe<small>Monitor</small></h1>
            </a>
            <div class="global-status-widget" id="global-status" role="status" aria-label="System status">
                <span class="status-led" id="global-led" aria-hidden="true"></span>
                <strong id="global-text">Connecting…</strong>
            </div>
            <div class="header-controls">
                <button type="button" class="music-toggle" id="music-btn" aria-pressed="false">Music off</button>
                <button type="button" class="theme-toggle" id="theme-btn">Light mode</button>
            </div>
        </div>
    </header>

    <main class="dashboard-layout">
        <aside class="cards-column" aria-label="Latest check status">
            <div class="checks-heading">
                <h2>Production checks</h2>
                <button type="button" class="run-controls-btn" id="controls-btn">Run controls</button>
                <a class="run-controls-btn" id="workflow-link" target="_blank" rel="noopener" hidden>GitHub Actions ↗</a>
            </div>
            <template id="card-template">
                <article class="card">
                    <div class="title-wrapper"><div class="title-left">
                        <h3></h3>
                        <button type="button" class="info-icon info-symbol"><span aria-hidden="true">i</span><span class="tooltip"></span></button>
                    </div></div>
                    <div class="status-badge status-inactive">
                        <svg aria-hidden="true" class="heartbeat-icon" viewBox="0 0 100 30">
                            <path class="hb-base" pathLength="100"/>
                            <path class="hb-path" pathLength="100"/>
                        </svg>
                        <span class="status-caption">WAITING</span>
                    </div>
                    <div class="meta">
                        <p class="check-time">
                            <span class="meta-label">Last checked</span>
                            <time class="checked"><span class="check-hour">—</span><span class="check-date"></span></time>
                        </p>
                        <p class="check-environment"><span class="environment"></span></p>
                    </div>
                    <div class="card-footer">
                        <div class="card-recent" role="group" hidden>
                            <span>Recent runs</span>
                            <div class="recent-markers"></div>
                        </div>
                        <div class="card-evidence"></div>
                    </div>
                </article>
            </template>
        </aside>

        <section class="chart-section" aria-labelledby="matrix-title">
            <div class="chart-heading">
                <div class="title-left">
                    <h2 id="matrix-title">Stability history</h2>
                    <button type="button" class="info-icon info-symbol" aria-label="About stability history"><span aria-hidden="true">i</span><span class="tooltip">Select a dot to open its run. Use the date filters for earlier runs or Table for keyboard access.</span></button>
                </div>
                <div class="chart-toggles" role="group" aria-label="History view">
                    <button type="button" class="chart-btn active" data-mode="2d" aria-pressed="true">Timeline</button>
                    <button type="button" class="chart-btn" data-mode="3d" aria-pressed="false">3D</button>
                    <button type="button" class="chart-btn" data-mode="table" aria-pressed="false">Table</button>
                </div>
            </div>
            <div class="history-toolbar">
                <div class="date-range" role="group" aria-label="Date range">
                    <label for="start-date">From<input type="date" id="start-date" class="date-picker" aria-describedby="date-error"></label>
                    <label for="end-date">To<input type="date" id="end-date" class="date-picker" aria-describedby="date-error"></label>
                </div>
                <div class="history-meta">
                    <p class="chart-range" id="chart-range"></p>
                    <p class="chart-range" id="feed-status" hidden></p>
                </div>
            </div>
            <p class="date-error" id="date-error" role="status" hidden></p>
            <div class="chart-container" id="chartContainer">
                <div id="historyChart" role="img" aria-label="Pass and fail timelines for Smoke, Regression, and Conversion"></div>
                <div class="graph-message" id="chart-message" role="status" hidden></div>
                <div class="guide-3d" id="chart-guide" hidden><span><b>Select a dot</b> for details</span><span><b>Drag</b> to rotate</span><span><b>Scroll</b> to zoom</span></div>
            </div>
            <div class="table-container" id="tableContainer" hidden>
                <div class="table-header-row">
                    <h3>Run history</h3>
                    <div class="export-controls">
                        <select id="export-format" class="export-select" aria-label="Export format">
                            <option value="csv">CSV (Excel)</option><option value="json">JSON File</option><option value="txt">Plain Text</option>
                        </select>
                        <button type="button" class="export-btn" id="export">Export</button>
                    </div>
                </div>
                <div class="data-table-wrapper" tabindex="0" aria-label="Execution history table">
                    <table class="data-table"><thead><tr><th scope="col">Date &amp; Time</th><th scope="col">Test Workflow</th><th scope="col">Conclusion</th><th scope="col">Duration</th><th scope="col">Evidence</th></tr></thead><tbody id="run-table"></tbody></table>
                </div>
            </div>
        </section>
    </main>

    <dialog id="run-dialog" class="modal-content" aria-labelledby="run-title">
        <form method="dialog"><button class="modal-close" aria-label="Close run details">×</button></form>
        <div class="modal-header"><h2 id="run-title" tabindex="-1">Test Details</h2></div>
        <div id="run-detail"></div>
    </dialog>
    <dialog id="controls-dialog" class="modal-content" aria-labelledby="controls-title">
        <form method="dialog"><button class="modal-close" aria-label="Close monitor controls">×</button></form>
        <div class="modal-header"><h2 id="controls-title">Run controls</h2></div>
        <div class="run-actions">
            <select id="suite" class="export-select" aria-label="Check suite"><option value="smoke">Smoke</option><option value="regression">Regression</option></select>
            <button type="button" class="theme-toggle" id="run" disabled>▶ Run check</button>
            <button type="button" class="theme-toggle" id="schedule" disabled>Pause schedule</button>
        </div>
        <p id="activity" role="status">Connecting to the local monitor…</p>
        <p id="next-checks"></p>
    </dialog>
</body>
</html>
